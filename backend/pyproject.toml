[project]
name = "provamusteri-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "python-multipart>=0.0.9",
  "argon2-cffi>=23.1",
  "httpx>=0.27",
  "python-ulid>=2.7",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "pyyaml>=6",
  "jsonschema[format]>=4.23",
  "openapi-spec-validator>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
