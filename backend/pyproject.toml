[project]
name = "provamusteri-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "python-multipart>=0.0.9",
  "argon2-cffi>=23.1",
  "httpx>=0.27",
  "python-ulid>=2.7",
  "av>=14",
  "numpy>=2",
]

[project.optional-dependencies]
tts = ["piper-tts>=1.3,<2"]

[dependency-groups]
dev = [
  "sounddevice>=0.5",  # eval/mic_session.py
  "pytest>=8",
  "ruff>=0.6",
  "pyyaml>=6",
  "jsonschema[format]>=4.23",
  "openapi-spec-validator>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
extend-exclude = ["alembic/versions"]  # Alembic üretir
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI Depends/File/Form varsayılan argümanda kullanılır

[tool.ruff.lint.per-file-ignores]
"app/services/prompts.py" = ["E501"]  # prompt içindeki JSON örnekleri tek satır kalmalı
"../eval/draft_bench.py" = ["E501"]  # ölçüm formlarındaki uzun Türkçe politika metinleri

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]  # eval/ betikleri de app'i birinci taraf saysın (çalışma dizininden bağımsız)
