<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (() => {
        let theme;
        try { theme = localStorage.getItem("pm_theme"); } catch {}
        if (!["light", "dark", "quartz", "charcoal"].includes(theme)) theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
        document.documentElement.classList.toggle("dark", theme === "dark" || theme === "charcoal");
        document.documentElement.style.colorScheme = theme === "dark" || theme === "charcoal" ? "dark" : "light";
      })();
    </script>
    <title>ProvaMüşteri</title>
    <link rel="icon" type="image/png" href="/logo-blue.png" />
    <link rel="apple-touch-icon" href="/logo-blue.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,520;9..144,620&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
