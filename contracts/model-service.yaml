openapi: 3.1.0
info:
  title: ProvaMüşteri model servisi
  version: 0.1.0
  description: |
    Backend worker'ı ile Gemma runtime'ı arasındaki iç arayüz. Tarayıcı buna erişmez.
    Servis domain bilmez: prompt'lar backend'de sürümlü tutulur (backend/app/services/prompts.py).
    Aynı anda tek üretim yapılır; bekleyenler `priority` değerine göre sıralanır (küçük önce).
    Çalışan bir üretim kesilmez.
servers:
  - url: http://localhost:8100
paths:
  /v1/health:
    get:
      operationId: health
      responses:
        "200":
          description: Model yüklü ve ısınmış
          content:
            application/json:
              schema:
                type: object
                required: [status, model, runtime, device]
                properties:
                  status: { type: string, const: ok }
                  model: { type: string, examples: ["google/gemma-4-E2B-it"] }
                  runtime: { type: string, examples: [transformers] }
                  device: { type: string, examples: [mps, cuda, cpu] }
        "503": { description: Model yükleniyor }
  /v1/generate:
    post:
      operationId: generate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GenerateRequest" }
      responses:
        "200":
          description: Üretilen metin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenerateResponse" }
        "422": { description: Geçersiz istek (ör. bozuk base64) }
        "503": { description: Model yükleniyor }
components:
  schemas:
    GenerateRequest:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          minItems: 1
          items:
            type: object
            required: [role, content]
            properties:
              role: { type: string, enum: [system, user, assistant] }
              content:
                oneOf:
                  - type: string
                  - type: array
                    items:
                      oneOf:
                        - type: object
                          required: [type, text]
                          properties:
                            type: { const: text }
                            text: { type: string }
                        - type: object
                          required: [type, audio_b64]
                          description: 16 kHz mono PCM WAV, en fazla 30 sn (Gemma 4 sınırı). Metinden SONRA konur.
                          properties:
                            type: { const: audio }
                            audio_b64: { type: string, maxLength: 4194304 }
        max_new_tokens: { type: integer, minimum: 1, maximum: 2048, default: 256 }
        sampling:
          description: null ise greedy (ASR). Resmî öneri temperature=1.0, top_p=0.95, top_k=64.
          oneOf:
            - type: "null"
            - type: object
              properties:
                temperature: { type: number, minimum: 0, maximum: 2 }
                top_p: { type: number, exclusiveMinimum: 0, maximum: 1 }
                top_k: { type: integer, minimum: 1 }
        priority:
          type: integer
          minimum: 0
          maximum: 100
          default: 10
          description: 0 = etkileşimli (ASR, müşteri cevabı), 10 = arka plan (değerlendirme, taslak).
    GenerateResponse:
      type: object
      required: [text, new_tokens, input_tokens, seconds, queue_seconds, model, runtime]
      properties:
        text: { type: string }
        new_tokens: { type: integer }
        input_tokens: { type: integer }
        seconds: { type: number, description: Yalnız üretim süresi }
        queue_seconds: { type: number, description: Slot için bekleme süresi }
        model: { type: string }
        runtime: { type: string }
